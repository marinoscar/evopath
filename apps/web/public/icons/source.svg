<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE HUMAN-EDITABLE SOURCE FOR THE BRAND MARK.

  Nothing loads this file at runtime — it is not referenced by index.html, by a
  manifest, or by any component. It exists so the mark can be opened in a
  vector editor, adjusted, and have something to match the raster icons
  against.

  It is NOT rasterised by the build. `apps/web/scripts/generate-icons.py` draws
  the same geometry in Pillow rather than converting this SVG, because rendering
  an SVG needs rsvg / cairosvg / a headless browser — precisely the image
  toolchain this template refuses to require of a fork's CI. The two therefore
  describe the mark twice, and MUST be kept in step: edit here, mirror the
  geometry constants in that script, re-run it.

  The mark: "the path". The product is the user's path of health evolution,
  built on a longitudinal record, and the mark is that path as a silhouette — one
  smooth white stroke that enters low on the left, dips once, then climbs to
  the upper right and ends in a filled dot: the latest measurement, "you are
  here". One colour, no gradient, no outline.

  Geometry, on a 512 canvas (all values derive from the script's constants;
  the path is laid out in a square MARK BOX, 0..1 on both axes, y down):
    plate     512 square, corner radius 0.22 x 512 = 112.64
    mark box  0.68 x 512 = 348.16 a side, centred: origin (81.92, 81.92)
    path      start (0.02, 0.78)
              cubic to (0.42, 0.90), controls (0.16, 0.78) (0.28, 0.92)  [the dip]
              cubic to (0.98, 0.18), controls (0.60, 0.88) (0.74, 0.22)  [the climb]
    stroke    0.16 x 348.16 = 55.71, round caps, round joins
    end dot   radius 0.13 x 348.16 = 45.26, centred on the path's end
  The stroke and dot overhang the box slightly: the box frames the path's
  CENTRELINE, which is what the `d` attribute describes.

  The plate colour is `themeColor` from `packages/shared/identity.json`, which
  is the source of truth. This file holds a COPY of it, because an SVG
  attribute cannot read a manifest -- and unlike the generator script, which
  loads the manifest, nothing keeps this copy in step automatically.
  `scripts/rename.mjs` rewrites it (anchored on the plate's `fill`, which must
  therefore be the ONLY occurrence of that colour in this file; the mark uses
  `stroke`/`fill` of white only), and the template-identity guard fails if it
  ever drifts.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Application mark">
  <rect width="512" height="512" rx="112.64" ry="112.64" fill="#0f766e"/>
  <path d="M88.88 353.48 C137.63 353.48 179.4 402.23 228.15 395.26 C290.82 388.3 339.56 158.52 423.12 144.59" fill="none" stroke="#ffffff" stroke-width="55.71" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="423.12" cy="144.59" r="45.26" fill="#ffffff"/>
</svg>
