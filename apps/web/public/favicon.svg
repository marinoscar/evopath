<?xml version="1.0" encoding="UTF-8"?>
<!--
  The same mark as `icons/source.svg` ("the path"), drawn on a 32 canvas with
  the tighter favicon crop (mark box at 80% of the canvas instead of 68%): at
  tab size the padding costs whole pixels, and the stroke and its end dot need
  those pixels to stay a line and a dot. `favicon.ico`'s frames use the
  identical crop, so the vector and raster favicons agree.

  Kept deliberately terse — no comments inside the markup, no metadata, no
  editor cruft — because this is served on every page load.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7.04" fill="#0f766e"/>
  <path d="M3.71 23.17 C7.3 23.17 10.37 26.75 13.95 26.24 C18.56 25.73 22.14 8.83 28.29 7.81" fill="none" stroke="#fff" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28.29" cy="7.81" r="3.33" fill="#fff"/>
</svg>
