# Keep the build friendly to shared CI runners and small dev machines.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App identity and server default. Override on the command line, e.g.
#   ./gradlew assembleRelease -Pevopath.versionName=0.1.42 -Pevopath.versionCode=42
evopath.versionName=0.1.0
evopath.versionCode=1
# Empty means the app shows a first-run setup screen asking for the server URL.
evopath.serverUrl=
