# =============================================================================
# Nginx Configuration - Reverse Proxy
# =============================================================================
# Routes:
#   /           -> web (React frontend)
#   /api        -> api (NestJS backend)
#   /api/docs   -> api (Swagger UI)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Upstream definitions
    upstream api_upstream {
        server api:3000;
        keepalive 32;
    }

    upstream web_upstream {
        server web:5173;
        keepalive 32;
    }

    # Content Security Policy, split out into csp.conf (maps are only valid at
    # http scope). Split rather than inlined here because /api/docs (the
    # Scalar reference) needs a different policy than the rest of the app, and
    # the dev compose overlay needs to relax script-src for Vite's inline
    # React Refresh preamble — both are one-file swaps this way instead of
    # forking the whole of nginx.conf. See csp.conf and csp.dev.conf for the
    # per-policy rationale.
    include /etc/nginx/csp.conf;

    server {
        listen 80;
        server_name localhost;

        # ---------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------
        # NOTE: nginx's add_header REPLACES, it does not merge. Any location
        # block that declares its own add_header loses every header set here,
        # so a location needing an extra header must repeat these too.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # microphone=(self), not (): an empty allowlist disables the device for
        # EVERY origin, our own included, and no browser or site setting can
        # override it. getUserMedia rejects and permissions.query() reports
        # `denied`, so the AI Playground's Voice mode could never start
        # (issue #559). (self) grants it to this origin only, never to a frame.
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;

        # HSTS. Browsers ignore this over plain HTTP, so it is inert for local
        # development on http://localhost:3535 and takes effect only once the
        # app is served over TLS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content Security Policy. Per-path policy selected by the $csp_policy
        # map in csp.conf (dev.compose.yml overrides it with csp.dev.conf).
        # worker-src and manifest-src are explicit for PWA support (issue #220):
        # default-src 'self' covers both in spec-compliant browsers, but Safari
        # has historically required manifest-src spelled out. See csp.conf /
        # csp.dev.conf for the full per-policy rationale.
        add_header Content-Security-Policy $csp_policy always;

        # -------------------------------------------------------------------------
        # Server-Sent Events stream -> NestJS backend (issue #127, epic #109)
        # -------------------------------------------------------------------------
        #
        # A DEDICATED BLOCK, because the buffering and timeout defaults that suit
        # a JSON request are not the ones you want on a connection that stays
        # open for hours. nginx matches the LONGEST prefix, so this wins over
        # `/api` below regardless of the order they appear in.
        #
        # Honest scope of what was verified, so nobody trusts this more than it
        # earned: this config was run against real nginx with a real SSE
        # upstream, and events arrive at the client one second apart, unbuffered.
        # That is the property that matters and it holds.
        #
        # What was NOT reproduced, and is therefore NOT claimed here: with these
        # directives removed, a small-payload stream still passed through
        # promptly in that same test, and an idle stream was not cut off at
        # `proxy_read_timeout`. So treat the directives below as the documented,
        # widely-recommended configuration for SSE behind nginx — defensive
        # against buffering under load, larger payloads, gzip, and other nginx
        # builds — rather than as fixes for failures demonstrated here.
        #
        #   proxy_buffering off / proxy_cache off
        #     The standard SSE recommendation. The API also sets
        #     `X-Accel-Buffering: no` on the response, which is the server-side
        #     half of the same intent; neither is relied on alone.
        #
        #   proxy_read_timeout 1h
        #     Notifications are rare by nature, so an idle connection is the
        #     normal case, not a stuck one. The API heartbeats every 25s, so a
        #     read timeout should only ever fire if the API has genuinely
        #     stopped writing.
        #
        #   proxy_set_header Connection ''
        #     The `/api` block sets `Connection "upgrade"` unconditionally for
        #     WebSocket support. SSE is ordinary HTTP, not an upgrade, so the
        #     inherited header is simply wrong here.
        #
        # VERIFY THROUGH THE PROXY, never against the API directly — a buffering
        # problem is invisible when you curl port 3000.
        location /api/notifications/stream {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';

            # Stream, do not accumulate
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Long-lived by design; the API heartbeats every 25s
            proxy_connect_timeout 60s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
        }

        # -------------------------------------------------------------------------
        # AI response streaming (SSE) — issue #433, epic #419
        # -------------------------------------------------------------------------
        # `POST /api/ai/responses/stream` answers one prompt as a
        # `text/event-stream` of token deltas. Through the generic `/api` block
        # below it would be BUFFERED (the user sees nothing until nginx's buffer
        # fills or the answer ends) and cut off by its 60s read timeout — a
        # reasoning model can legitimately think for longer than that before its
        # first token. Same treatment as the notifications stream above, and the
        # same longest-prefix rule makes it win over `/api` regardless of order.
        #
        #   proxy_buffering off / proxy_cache off
        #     Forward each frame as it is written. The API also sends
        #     `X-Accel-Buffering: no` (the server-side half of the same intent).
        #
        #   proxy_read_timeout 600s
        #     One answer, not a feed: ten minutes bounds a runaway generation.
        #     The API writes a `: ping` comment every 15s, so the timeout only
        #     fires if the API has genuinely stopped writing.
        #
        #   proxy_set_header Connection ''
        #     SSE is ordinary HTTP, not a WebSocket upgrade (see above).
        #
        #   client_max_body_size 2m
        #     The API caps the JSON body at 1 MB; this lets that limit answer
        #     with its own error instead of a bare nginx 413.
        #
        # gzip: `text/event-stream` is deliberately absent from `gzip_types`
        # above — compressing a stream buffers it. Keep it absent.
        #
        # Closing the connection (a Stop button, a closed tab) propagates to
        # the API, which aborts the provider call.
        location /api/ai/responses/stream {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';

            # Stream, do not accumulate
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # One long answer; the API heartbeats every 15s
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            client_max_body_size 2m;
        }

        # -------------------------------------------------------------------------
        # Telemetry AI assistant streaming (SSE) — issue #536, epic #528
        # -------------------------------------------------------------------------
        # `POST /api/admin/telemetry/assistant/stream` answers one question as a
        # `text/event-stream` of tool steps and a final answer. Identical needs
        # to the AI response stream above (unbuffered, long read timeout, the
        # API heartbeats every 15s, never gzipped); its own block because the
        # longest-prefix match for it would otherwise be the generic `/api`.
        location /api/admin/telemetry/assistant/stream {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';

            # Stream, do not accumulate
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # One turn of up to 20 model round-trips and queries; the API heartbeats every 15s
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            client_max_body_size 2m;
        }

        # -------------------------------------------------------------------------
        # API routes -> NestJS backend
        # -------------------------------------------------------------------------
        location /api {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # -------------------------------------------------------------------------
        # Frontend routes -> React app
        # -------------------------------------------------------------------------
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for HMR in development
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------------------------------------
        # Health check endpoint for nginx itself
        # -------------------------------------------------------------------------
        location /nginx-health {
            access_log off;
            # default_type rather than add_header: add_header here would
            # replace the server-level security headers for this location.
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
