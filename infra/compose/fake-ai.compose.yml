# =============================================================================
# Docker Compose - Fake AI provider (development and e2e only)
# =============================================================================
# Usage (run from infra/compose folder):
#   docker compose -f base.compose.yml -f dev.compose.yml [-f devdb.compose.yml] -f fake-ai.compose.yml up
#
# A tiny OpenAI-compatible server (tests/e2e/support/fake-vision-server.mjs)
# that answers every chat completion with a canned "Scan gym" result from
# apps/api/test/fixtures/gym-scan, a "Prefill from photo" result from
# apps/api/test/fixtures/workout-prefill, a body-metric reading from
# apps/api/test/fixtures/body-metric (a PDF gets the smart-scale report), or a
# lab report from apps/api/test/fixtures/lab-report. No key,
# no cost, deterministic. A PDF needs the file_input capability on fake-vision.
#
# Point the API at it at runtime, never with an environment variable: in
# /admin/settings/ai enable the OpenAI-compatible provider with base URL
# http://fake-ai:4010/v1, API style chat_completions and "requires key" off;
# then refresh the catalog at /admin/settings/ai/models and enable fake-vision
# with the responses, structured_output and vision_input capabilities.
#
# A second, separate server (tests/e2e/support/fake-responses-server.mjs) speaks
# the OpenAI Responses API for the agentic training plan flow: hosted
# web_search, structured outputs and reasoning usage, replaying the scenario
# fixtures in apps/api/test/fixtures/training/scenarios (the same files the Jest
# scenario suites replay). Point the `openai` provider slot at it at runtime:
# base URL http://fake-ai-responses:4011/v1, any key of 8 or more characters;
# refresh the catalog (fake-frontier, fake-fast), classify both with the
# responses, reasoning and structured_output capabilities and reasoning efforts
# low, medium and high, add hosted_tools to fake-frontier only (fake-fast cannot
# search), enable them, and switch Web search on.
# `npm test` in tests/e2e does all of that itself (training-plans.spec.ts).
#
# Host port 4011:
#   curl -X POST localhost:4011/__control/scenario -d '{"name":"critic-reject-once"}'
#   curl localhost:4011/__control/scenarios    # every scenario and its description
#   curl localhost:4011/__control/requests     # per request: agent, model, effort, tool types,
#                                              # input size, canary hits; never keys, prompts or bodies
#   curl -X POST localhost:4011/__control/reset
# The fake counts the canary markers the e2e setup plants in a user's bio,
# check-in notes and display name (DEFAULT_CANARY_MARKERS in the server; set
# CANARY_TOKENS on this container only to override), so a test can prove data
# minimisation from outside the API. The application has no such variable.
#
# Quick adaptation and the hotel scan (tests/e2e/specs/training-adaptation.spec.ts)
# use the SAME server on port 4010 and the same `openai-compatible` slot. It also
# lists fake-planner, fake-critic and fake-text-only (text and structured output;
# classify them with the responses and structured_output capabilities) and picks
# its answer by the structured-output schema name of each request. The planner's
# answer is computed from the <context-json> block of the request, so no exercise
# id is hard-coded. Scenarios (global, POST /__control/scenario; a request can
# override with a SCENARIO:<name> token in its free text; default valid):
#   valid, critic-revise, unknown-exercise, over-time, over-volume, malformed,
#   rate-limit, slow, heavy-tokens, scan-hotel, scan-empty
#   curl localhost:4010/__control/scenario     # current scenario and every description
#   curl localhost:4010/__control/log          # per completion: schema name, scenario, image
#                                              # count, status and message text (never bytes)
# `npm test` in tests/e2e does the setup itself (training-adaptation.spec.ts).
# The API must reach the server at the base URL the specs set (FAKE_AI_API_BASE_URL,
# default http://fake-ai:4010/v1); the runner reaches it at FAKE_AI_URL (default
# http://localhost:4010).
#
# Host port 4010:
#   curl -X POST localhost:4010/__control/next -d '{"fixture":"leg-curl-placard"}'
#   curl -X POST localhost:4010/__control/next -d '{"fixture":"workout-notebook"}'
#   curl localhost:4010/__control/requests     # image counts only, never bytes
#   curl -X POST localhost:4010/__control/reset
#
# AI Coach (E7.13): the same two servers answer the coach with no key. Port 4010
# serves model `fake-coach` (classify it responses, structured_output, tools and
# streaming; assign coach.decision and coach.chat): the structured nudge and
# weekly review by schema name, and the chat tool loop. Port 4011 serves model
# `fake-tts` and POST /v1/audio/speech (a silent MP3 over 1 KiB; assign
# coach.voice). Behaviour switches, reset by /__control/reset:
#   curl -X POST localhost:4010/__control/coach -d '{"nudge":"decline"}'      # or "send"
#   curl -X POST localhost:4011/__control/speech -d '{"mode":"refuse"}'       # or "ok", "fail"
# `npm test -- coach-settings coach-page` in tests/e2e does the setup itself.
# =============================================================================

services:
  fake-ai:
    image: node:24-alpine
    command: node /support/fake-vision-server.mjs
    volumes:
      - ../../tests/e2e/support:/support:ro
      - ../../apps/api/test/fixtures:/fixtures:ro
    environment:
      FIXTURE_DIR: /fixtures
    ports:
      - "4010:4010"
    networks:
      - app-network

  fake-ai-responses:
    image: node:24-alpine
    command: node /support/fake-responses-server.mjs
    volumes:
      - ../../tests/e2e/support:/support:ro
      - ../../apps/api/test/fixtures/training:/training:ro
    environment:
      SCENARIO_DIR: /training/scenarios
    ports:
      - "4011:4011"
    networks:
      - app-network
