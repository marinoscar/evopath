# =============================================================================
# Docker Compose - VPS Overrides for the Telemetry Stack
# =============================================================================
# Applied LAST, and only when the deployment enabled the `observability` group:
#
#   docker compose \
#     -f base.compose.yml \
#     -f prod.compose.yml \
#     -f telemetry.compose.yml \
#     -f vps.compose.yml \
#     -f vps.telemetry.compose.yml \
#     up -d
#
# `appctl deploy` builds that list itself (apps/cli/src/deploy/compose-files.ts)
# from the groups recorded at install time; nobody types it by hand.
#
# WHY A SEPARATE FILE, not more entries in vps.compose.yml: vps.compose.yml is
# applied to EVERY VPS deployment, including those without telemetry. A
# service block there for `greptimedb` or `otel-collector` would be a
# service with no image, and `docker compose config` fails the whole stack
# with "has neither an image nor a build context". The hardening has to travel
# with the services it hardens.
#
# Same rule as vps.compose.yml: NOTHING IN THE STACK MAY BE PUBLISHED ON A
# PUBLIC INTERFACE. telemetry.compose.yml publishes development ports on
# 0.0.0.0; every one of them is replaced here.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector - no host ports at all
  # ---------------------------------------------------------------------------
  otel-collector:
    # The API reaches the collector over the compose network
    # (http://otel-collector:4318). Nothing outside the stack sends OTLP to a
    # VPS deployment, so there is nothing to publish -- not even on loopback.
    #
    # `!override` with an empty list REPLACES telemetry.compose.yml's
    # "4327:4317" / "4328:4318"; a plain `ports:` would MERGE and keep them.
    ports: !override []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # GreptimeDB - PostgreSQL wire protocol on loopback only
  # ---------------------------------------------------------------------------
  greptimedb:
    # Only the PostgreSQL wire protocol is published, and only on 127.0.0.1:
    # an analyst reaches it through an SSH tunnel
    # (`ssh -L 14003:127.0.0.1:14003 <host>`), then logs in as
    # GREPTIME_READER_USER. The HTTP API / SQL dashboard (4000) is NOT
    # published: it accepts the same credentials over plain HTTP, and the
    # tunnelled psql session already covers the read use case.
    #
    # Verify with `docker compose ... config`: ONE entry, host_ip 127.0.0.1.
    ports: !override
      - "127.0.0.1:${GREPTIME_BIND_PG_PORT:-14003}:4003"
    restart: unless-stopped
    # telemetry.compose.yml already caps GreptimeDB at 1G; restated here so the
    # production limit does not silently follow a development tweak there.
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
